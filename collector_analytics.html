<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics | EcoTrack</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b09;color:#f3f6f1;font-family:Arial,sans-serif}
main{max-width:1000px;margin:auto;padding:45px 25px}a{color:#a8ff3e;text-decoration:none}
.label{color:#a8ff3e;font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}
h1{font-size:45px;margin:8px 0}.sub{color:#7d867d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.card{padding:24px;background:#111611;border:1px solid #283028;border-radius:14px}
.num{font-size:34px;font-weight:bold;color:#a8ff3e;margin-top:8px}
@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:36px}}
</style>
</head>
<body>
<main>
<a href="{{ url_for('collector') }}">← Back to Dashboard</a>
<div style="margin-top:30px" class="label">Collector Control</div>
<h1>Analytics</h1>
<p class="sub">Your collection performance.</p>
<div class="grid">
<div class="card">TOTAL REQUESTS<div class="num">{{ total }}</div></div>
<div class="card">ACTIVE<div class="num">{{ active }}</div></div>
<div class="card">COMPLETED<div class="num">{{ completed }}</div></div>
</div>
</main>
</body>
</html>
